<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Link Shortener{% endblock %}</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <header class="topbar">
        <a class="brand" href="/dashboard">Link Shortener</a>
        {% if request.session.get("logged_in") %}
        <nav>
            <a href="/dashboard">Links</a>
            <a href="/dashboard/new">New Link</a>
            <a href="/logout">Logout ({{ request.session.get("username") }})</a>
        </nav>
        {% endif %}
    </header>
    <main class="container">
        {% block content %}{% endblock %}
    </main>
</body>
</html>
